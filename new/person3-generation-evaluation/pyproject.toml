[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "person3-generation-evaluation"
version = "0.1.0"
description = "Grounded local generation and evaluation for the Vietnamese public-administration RAG system"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23",
  "referencing>=0.35"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
person3 = "person3_generation_evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
