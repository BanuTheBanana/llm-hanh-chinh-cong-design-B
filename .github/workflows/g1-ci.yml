name: G1 CI

on:
  push:
    branches: [main, "g1/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check-repo-hygiene.py

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.33
          uv sync --frozen --extra test
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen python -m pytest

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: g1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d g1_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/g1_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.33
          uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen python -m pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  full-compose-smoke:
    runs-on: ubuntu-latest
    needs: [repository-hygiene, ai-service, backend, web]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install browser smoke dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Validate Compose configuration
        run: docker compose --profile full config --quiet
      - name: Build and start the complete G1 stack
        run: docker compose --profile full up --build --detach --wait
      - name: Verify Web is reachable
        run: python -c "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:3000', timeout=10).status == 200"
      - name: Run live API smoke flow
        run: python scripts/smoke-e2e.py
      - name: Run live browser smoke flow
        working-directory: web
        run: npm run test:e2e
      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile full logs --no-color
      - name: Stop the complete G1 stack
        if: always()
        run: docker compose --profile full down --volumes --remove-orphans
