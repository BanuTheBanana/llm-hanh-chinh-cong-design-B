# Apply last, after compose.yaml + compose.g3.local.yaml + compose.g4.local.yaml.
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp@sha256:93e3b8da7ce2d7c501e826e3c87b6fde980fac18a8058d38e24529a5b3b83b94
    gpus: all
    command:
      - --model
      - /models/model.gguf
      - --alias
      - ${G4_MODEL_NAME:-Qwen3-1.7B}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --jinja
      - --chat-template-kwargs
      - '{"enable_thinking":false}'
      - --reasoning
      - "off"
      - --n-gpu-layers
      - "99"
      - --flash-attn
      - "on"
      - --ctx-size
      - "4096"
      - --predict
      - "500"
      - --no-context-shift
    volumes:
      - type: bind
        source: ${G4_MODEL_HOST_PATH:?Set G4_MODEL_HOST_PATH to a tested GGUF}
        target: /models/model.gguf
        read_only: true
    ports:
      - "127.0.0.1:${LLAMA_SERVER_PORT:-8084}:8080"
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    init: true
    networks: [app-network]
  ai-service:
    environment:
      LOCAL_LLM_BASE_URL: http://llama-server:8080/v1
      LOCAL_LLM_ALLOWED_HOSTS: llama-server
    depends_on:
      llama-server:
        condition: service_healthy
