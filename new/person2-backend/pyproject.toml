[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hanh-chinh-backend-mock-rag"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1", "uvicorn==0.54.0", "pydantic-settings==2.15.0", "sqlalchemy[asyncio]==2.0.54", "asyncpg==0.31.0", "jsonschema==4.26.0", "referencing==0.37.0"]

[tool.setuptools.packages.find]
include = ["app*"]
