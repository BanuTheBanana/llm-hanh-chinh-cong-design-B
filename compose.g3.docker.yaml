# Docker-only Qwen runtime for the G3 demo. Apply after compose.g3.local.yaml.
# The GGUF model stays outside Git and is mounted read-only.
services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp@sha256:93e3b8da7ce2d7c501e826e3c87b6fde980fac18a8058d38e24529a5b3b83b94
    gpus: all
    command:
      - --model
      - /models/Qwen3-1.7B-Q8_0.gguf
      - --alias
      - Qwen3-1.7B
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --jinja
      - --chat-template-file
      - /runtime/qwen3_nonthinking.jinja
      - --n-gpu-layers
      - "99"
      - --flash-attn
      - "on"
      - --temp
      - "0.2"
      - --top-p
      - "0.8"
      - --top-k
      - "20"
      - --min-p
      - "0.0"
      - --presence-penalty
      - "1.5"
      - --seed
      - "42"
      - --ctx-size
      - "4096"
      - --predict
      - "500"
      - --no-context-shift
    volumes:
      - type: bind
        source: ${G3_MODEL_HOST_PATH:?Set G3_MODEL_HOST_PATH to the Qwen GGUF file}
        target: /models/Qwen3-1.7B-Q8_0.gguf
        read_only: true
      - type: bind
        source: ./ai-service/runtime/qwen3_nonthinking.jinja
        target: /runtime/qwen3_nonthinking.jinja
        read_only: true
    ports:
      - "127.0.0.1:${LLAMA_SERVER_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - http://localhost:8080/health
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    init: true
    networks:
      - app-network

  ai-service:
    environment:
      LOCAL_LLM_BASE_URL: http://llama-server:8080/v1
      LOCAL_LLM_ALLOWED_HOSTS: llama-server
    depends_on:
      llama-server:
        condition: service_healthy
