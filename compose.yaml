name: ${COMPOSE_PROJECT_NAME:-hanh-chinh-g1}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hanh_chinh_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      MOCK_MODE: ${MOCK_MODE:-success}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-10}
      MOCK_TIMEOUT_SECONDS: ${MOCK_TIMEOUT_SECONDS:-35}
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    init: true
    networks:
      - app-network

  backend:
    profiles: [backend, full]
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-tro-ly-hanh-chinh-mvp}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-86400}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://app_user:change-me-local-only@postgres:5432/hanh_chinh_mvp}
      # Base origin only; Backend appends /internal/v1/generate.
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-3}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        .venv/bin/alembic upgrade head &&
        exec .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-access-log --log-config logging.json
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    init: true
    networks:
      - app-network

  web:
    profiles: [full]
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
