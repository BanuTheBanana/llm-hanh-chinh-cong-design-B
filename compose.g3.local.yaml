# G3 private-data overlay. llama-server runs on the developer host. The reviewed
# D2 corpus is mounted read-only and is never sent to a hosted provider.
services:
  ai-service:
    environment:
      GROUNDED_PROVIDER: local
      LOCAL_LLM_BASE_URL: http://host.docker.internal:8080/v1
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-Qwen3-1.7B}
      LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-30}
      LOCAL_LLM_CONTEXT: ${LOCAL_LLM_CONTEXT:-4096}
      LOCAL_LLM_MAX_PROMPT_CHARACTERS: ${LOCAL_LLM_MAX_PROMPT_CHARACTERS:-8000}
      LOCAL_LLM_MAX_OUTPUT_TOKENS: ${LOCAL_LLM_MAX_OUTPUT_TOKENS:-500}
      LOCAL_LLM_TEMPERATURE: ${LOCAL_LLM_TEMPERATURE:-0.7}
      LOCAL_LLM_TOP_P: ${LOCAL_LLM_TOP_P:-0.8}
      LOCAL_LLM_TOP_K: ${LOCAL_LLM_TOP_K:-20}
      LOCAL_LLM_MIN_P: ${LOCAL_LLM_MIN_P:-0.0}
      LOCAL_LLM_PRESENCE_PENALTY: ${LOCAL_LLM_PRESENCE_PENALTY:-1.5}
      LOCAL_LLM_SEED: ${LOCAL_LLM_SEED:-42}
      LOCAL_LLM_ALLOWED_HOSTS: host.docker.internal
      LOCAL_LLM_ALLOW_D2_COMPANY_DATA: "true"
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8001/internal/v2/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s

  backend:
    environment:
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-35}
      RAG_ENABLED: "true"
      RAG_CORPUS_VERSION: ${G3_DATASET_VERSION:-company-tthc-9c38dde8-v1-demo10-v1}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_ALLOW_FIXTURES: "false"
      G3_D2_ENABLED: "true"
      G3_PRIVATE_DATASET_PATH: /run/g3-dataset
      G3_EXPECTED_ROWS: ${G3_EXPECTED_ROWS:-10}
      G3_CORPUS_SHA256: ${G3_CORPUS_SHA256:-2875694a7cbb0238bfb4ebfdd562166b63f0851077ae824f62bbe234602b7d1e}
      G3_ALLOW_PRODUCTION: "false"
    volumes:
      - type: bind
        source: ${G3_PRIVATE_DATASET_HOST_PATH:-./.private-g3-dataset}
        target: /run/g3-dataset
        read_only: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health/rag', timeout=3)
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s
