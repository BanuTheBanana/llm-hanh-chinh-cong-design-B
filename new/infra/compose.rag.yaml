name: hanh-chinh-rag-demo
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hanh_chinh_mvp}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  backend:
    build:
      context: ..
      dockerfile: person2-backend/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-hanh_chinh_mvp}
      DB_USER: ${POSTGRES_USER:-app_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      SEGMENTER_BACKEND: ${SEGMENTER_BACKEND:-underthesea}
      ALLOW_DRAFT: ${ALLOW_DRAFT:-true}
      BOOTSTRAP_DEMO: ${BOOTSTRAP_DEMO:-true}
      BM25_SCORE_FLOOR: ${BM25_SCORE_FLOOR:-0.5}
      BM25_MARGIN: ${BM25_MARGIN:-0.15}
      API_TOKEN: ${API_TOKEN:-}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
volumes:
  rag_postgres_data:
