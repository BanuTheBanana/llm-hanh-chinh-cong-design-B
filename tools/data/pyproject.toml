[project]
name = "hcc-g3-data-tools"
version = "0.1.0"
description = "Private, deterministic preprocessing tools for the G3 company dataset"
requires-python = ">=3.11,<3.13"
dependencies = [
  "jsonschema[format]>=4.26,<5",
  "openpyxl>=3.1,<4",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
hcc-build-company-data = "g3_pipeline.builder:main"
hcc-validate-company-data = "g3_pipeline.validator:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["g3_pipeline*"]
